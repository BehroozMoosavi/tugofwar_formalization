  arxiv: ["math.AP", "cs.LO"]
  msc2020: ["35J92", "35D40", "49L20", "68V20"]

status:
  scope: >-
    The full convergence theorem, with every result it uses proved in Lean:
    the asymptotic expansion, the viscosity property of the relaxed limits,
    the boundary estimate, existence and uniqueness for the discrete problem,
    the comparison principle and uniqueness for the limit equation,
    Aleksandrov's theorem and Jensen's lemma.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "PLaplacian.pharmonious_exists_converge"
      file: "Plaplacian/DirichletExistence.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "claude.ai, with code execution"
      tool_setup: >-
        The model proposed formal statements and drafted Lean files under the
        authors' direction; every draft was compiled against the pinned Lean
        toolchain and Mathlib, and corrections were driven by the compiler's
        output.
      prompting_notes: >-
        The mathematical route (definitions, statements and proof strategy) was
        fixed by the authors; the model produced the Lean code, the blueprint
        and the documentation.
  notes: >-
    As stated in the accompanying article, the formalization was carried out
    with extensive use of a large language model under the authors' direction.
    The Lean kernel checks every proof.

fidelity:
  divergences: >-
    (1) The domain condition is the exterior sphere condition at every boundary
    point, with a ball that may depend on the point; MPR12 assume a uniform
    exterior ball condition. (2) The data F is a bounded continuous function on
    all of R^d, and u_eps is required to equal F on the whole complement of the
    domain, not only on the boundary strip. (3) The extreme values in the step
    operator are taken over open balls, and the boundary strip is
    {x outside the domain : dist(x, domain) <= eps}. (4) The equation is the
    normalized p-Laplacian; for the homogeneous equation its viscosity
    solutions coincide with those of the p-Laplace equation used in MPR12.
    (5) The compared theorem asserts existence, boundedness, agreement of the
    half-relaxed limits, the boundary values and uniform convergence; that the
    limit is a viscosity solution, and the uniqueness results, are proved in the
    library (ubar_isViscositySubsolution, lbar_isViscositySupersolution,
    visc_unique, pharmonious_unique) but are not part of the compared
    statement. (6) The hypotheses 0 < p + d and Nontrivial (EuclSpace d) are
    redundant, following from 2 <= p and 0 < d.

review:
  status: "self-assessed"
  reviewers: ["Juan J. Manfredi", "Behrooz Moosavi"]
  notes: >-
    The authors checked the formal statements against the informal ones; the
    accompanying article states every theorem together with its Lean statement.

alignment:
  namespace: "PLaplacian"
  statements:
    - source: "Main Theorem of the article; MPR12, Theorem 1.6 (adapted)"
      lean: "PLaplacian.pharmonious_exists_converge"
      module: "Plaplacian/DirichletExistence.lean"
      status: "proved"


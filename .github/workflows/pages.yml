name: Website

# Publishes the blueprint website to GitHub Pages: on every push that changes
# the site or the blueprint, and after each run of "Lean statements".
on:
  push:
    branches: [main]
    paths:
      - "docs/blueprint/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Lean statements"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Build the website
        run: python3 docs/blueprint/site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
